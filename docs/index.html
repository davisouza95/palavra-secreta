<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Palavra Secreta</title>
<style>
:root{color-scheme:dark;--bg:#111318;--surface:#191b22;--line:#ffffff14;--text:#f0f1f5;--muted:#9699a6;--accent:#b4a1ff;--mint:#90e2c2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -30%,#252333 0,transparent 54%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{height:60px;display:flex;align-items:center;border-bottom:1px solid #ffffff0d}.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-.4px}.mark{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;background:linear-gradient(145deg,#a88cff,#7455d9);color:white}.logo-name{color:#cbbaff}.main{padding:34px 0 55px}.title{text-align:center;margin:0 0 23px;font-size:clamp(28px,4vw,36px);line-height:1.15;letter-spacing:-1.3px}.categories,.game{width:min(620px,100%);margin-left:auto;margin-right:auto}.categories{display:flex;justify-content:space-between;gap:0;margin-bottom:15px;border-bottom:1px solid var(--line)}.tab{position:relative;flex:1;min-width:0;border:0;border-radius:3px;background:transparent;color:#9699a6;font:600 12px inherit;padding:9px 3px 11px;cursor:pointer;white-space:nowrap}.tab:hover{color:#e5e6eb}.tab[aria-selected="true"]{color:#d9ceff}.tab[aria-selected="true"]:after{content:"";position:absolute;bottom:-1px;left:8px;right:8px;height:2px;background:var(--accent)}.game{padding:0}.description{min-height:38px;margin:0;padding:3px 0 10px;color:#a7a9b5;font-size:12px;text-align:center}.round-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:stretch;gap:6px;margin:0 0 14px;border-bottom:1px solid #ffffff0d}.round-tab{position:relative;width:100%;min-height:34px;padding:6px 8px;border:0;background:transparent;color:#777b88;font-size:12px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;cursor:pointer}.round-tab[aria-selected="true"]{color:#ded5ff}.round-tab.done{color:var(--mint)}.round-tab:after{content:"";position:absolute;bottom:-1px;left:8px;right:8px;height:2px;background:transparent}.round-tab[aria-selected="true"]:after{background:var(--accent)}.round-tab:disabled{cursor:default;opacity:.35}.entry{display:flex;gap:6px}.entry input{height:40px;min-width:0;flex:1;border:1px solid #ffffff15;border-radius:4px;background:var(--surface);color:var(--text);padding:0 12px;font-size:13px;outline:none}.entry input:focus{border-color:#b4a1ff88;box-shadow:0 0 0 2px #b4a1ff18}.entry input::placeholder{color:#777b88}.button{height:40px;border:0;border-radius:4px;background:linear-gradient(135deg,#a58dff,#8065e8);color:white;padding:0 13px;font-weight:700;font-size:12px;cursor:pointer}.button:disabled{opacity:.42;cursor:not-allowed;filter:none}.button.secondary{background:#24232f;border:1px solid #ffffff12;color:#d7ccff;box-shadow:none}.balance{margin-left:2px;font-size:9px;opacity:.75}.attempts{margin:5px 1px 0;text-align:right;color:#777b88;font-size:10px}.clues{display:none;margin:9px 0 0;padding:8px 11px;border-left:2px solid #9e8be9;background:#ffffff05;color:#d7d0e9;font-size:11px;white-space:pre-line}.clues.show{display:block}.results-head,.guess{display:grid;grid-template-columns:1fr 142px;align-items:center}.results-head{margin-top:13px;padding:8px 6px;border-bottom:1px solid #ffffff0c;color:#777b88;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.9px}.results-head span:last-child{text-align:right}.guess{gap:10px;padding:8px 6px;border-bottom:1px solid #ffffff0a;font-size:12px}.guess:last-child{border-bottom:0}.word{font-weight:600;overflow-wrap:anywhere}.proximity{display:flex;align-items:center;justify-content:flex-end;gap:8px}.bar{width:90px;height:6px;border-radius:3px;background:#ffffff13;overflow:hidden}.fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#8279d9,#8ce6c0)}.label{width:62px;text-align:right;color:#989ba7;font-size:9px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100% - 28px);padding:10px 14px;border-radius:6px;background:#f2efff;color:#252033;font-size:12px;font-weight:600;text-align:center;box-shadow:0 12px 30px #0008;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.wrap{width:calc(100% - 26px)}.main{padding-top:27px}.title{font-size:29px;margin-bottom:18px}.tab{font-size:10px;padding:8px 1px 10px}.round-tabs{margin-bottom:12px}.entry{gap:5px}.button{padding:0 10px}.bar{width:72px}.results-head,.guess{grid-template-columns:1fr 121px}.description{min-height:0}}
</style>
</head>
<body>
<header class="top wrap"><div class="logo"><span class="mark" aria-hidden="true">✦</span><span>palavra<span class="logo-name">secreta</span></span></div></header>
<main class="main wrap">
<h1 class="title">Qual é a palavra secreta?</h1>
<nav class="categories" id="categories" role="tablist" aria-label="Categorias"></nav>
<section class="game" aria-label="Jogo diário">
<p class="description" id="description"></p>
<nav class="round-tabs" id="roundTabs" role="tablist" aria-label="Palavras do dia"></nav>
<form class="entry" id="form"><input id="guess" autocomplete="off" placeholder="Digite uma palavra..." aria-label="Digite uma palavra"><button class="button" type="submit">Enviar ↗</button><button class="button secondary" type="button" id="hintButton">Dica <span class="balance" id="hintBalance">7</span></button></form>
<div class="attempts" id="attempts"></div>
<div class="clues" id="clues"></div>
<div class="results-head"><span>Palavra</span><span>Proximidade</span></div>
<div id="guesses"></div>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const API_BASE = 'https://palavra-secreta-api.davisouza-eoab.workers.dev';
const STORAGE_ID = 'palavra-secreta-player-v1';
const el = {
  categories: document.querySelector('#categories'), roundTabs: document.querySelector('#roundTabs'),
  description: document.querySelector('#description'), form: document.querySelector('#form'),
  input: document.querySelector('#guess'), submit: document.querySelector('#form button[type="submit"]'),
  hint: document.querySelector('#hintButton'), hintBalance: document.querySelector('#hintBalance'),
  attempts: document.querySelector('#attempts'), clues: document.querySelector('#clues'),
  guesses: document.querySelector('#guesses'), toast: document.querySelector('#toast'),
};
function playerId() {
  let id = localStorage.getItem(STORAGE_ID);
  if (!id) { id = crypto.randomUUID(); localStorage.setItem(STORAGE_ID, id); }
  return id;
}
const player = playerId();
let categories = [], activeCategory = null, activeState = null, viewing = 0, busy = false, toastTimer;
async function api(path, body) {
  if (!API_BASE) throw new Error('A API ainda não foi configurada neste site.');
  const response = await fetch(`${API_BASE}${path}`, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Não foi possível acessar o jogo.');
  return data;
}
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function key(value) { return value.trim().normalize('NFC').replace(/[’‘]/g,"'").replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,' ').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function notify(message) { el.toast.textContent = message; el.toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600); }
function currentRound() { return activeState?.rounds?.[viewing] || []; }
function isPlayable() { return activeState && viewing === activeState.solved && activeState.solved < 3; }
function answerFor(index) { return activeState?.rounds?.[index]?.find(item => item.correct)?.word; }
function renderCategories() {
  el.categories.innerHTML = categories.map((category,index) => `<button class="tab" role="tab" aria-selected="${category.slug === activeCategory.slug}" data-index="${index}">${escapeHtml(category.name)}</button>`).join('');
  el.categories.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => selectCategory(Number(button.dataset.index))));
}
async function selectCategory(index) {
  activeCategory = categories[index];
  viewing = 0;
  renderCategories();
  el.description.textContent = activeCategory.description;
  el.guesses.innerHTML = '';
  el.clues.textContent = '';
  el.clues.classList.remove('show');
  try { activeState = await api(`/api/state?playerId=${encodeURIComponent(player)}&category=${encodeURIComponent(activeCategory.slug)}`); viewing = Math.min(activeState.solved, 2); render(); }
  catch (error) { activeState = null; render(); notify(error.message); }
}
function renderRoundTabs() {
  el.roundTabs.innerHTML = [0,1,2].map(index => {
    const done = index < activeState.solved, locked = index > activeState.solved, selected = index === viewing;
    const answer = done ? answerFor(index) : null;
    const label = answer || String(index + 1);
    const accessible = answer ? `Palavra ${index + 1}: ${answer}` : `Palavra ${index + 1}${locked ? ' bloqueada' : ' atual'}`;
    return `<button class="round-tab ${done ? 'done' : ''}" role="tab" aria-selected="${selected}" aria-label="${escapeHtml(accessible)}" title="${answer ? escapeHtml(answer) : ''}" data-index="${index}" ${locked ? 'disabled' : ''}>${escapeHtml(label)}</button>`;
  }).join('');
  el.roundTabs.querySelectorAll('.round-tab:not(:disabled)').forEach(button => button.addEventListener('click', () => { viewing = Number(button.dataset.index); render(); }));
}
function guessRow(item) {
  const score = Number(item.score) || 0;
  return `<div class="guess"><span class="word">${escapeHtml(item.word)}</span><span class="proximity">${score ? `<span class="bar"><span class="fill" style="width:${score}%"></span></span><span class="label">${escapeHtml(item.label)}</span>` : '<span class="label">—</span>'}</span></div>`;
}
function updateHintButton() {
  const need = [{total:30,since:0},{total:90,since:40},{total:180,since:60}][activeState.tipsUsed];
  el.hintBalance.textContent = activeState.tips;
  let reason = '';
  if (!isPlayable()) reason = 'Abra a palavra atual para pedir dica.';
  else if (activeState.tipsUsed >= 3) reason = 'Limite de dicas desta categoria atingido.';
  else if (activeState.tips <= 0) reason = 'As dicas do dia acabaram.';
  else {
    const remaining = Math.max(need.total - activeState.attempts, need.since - activeState.sinceTip, 0);
    if (remaining) reason = `Faltam ${remaining} tentativas para a próxima dica.`;
  }
  el.hint.disabled = busy || Boolean(reason);
  el.hint.title = reason || 'Pedir uma dica';
  el.hint.setAttribute('aria-label', `${reason || 'Pedir uma dica'} ${activeState.tips} disponíveis.`);
}
function render() {
  if (!activeState) {
    el.input.disabled = true; el.submit.disabled = true; el.hint.disabled = true;
    el.attempts.textContent = ''; el.guesses.innerHTML = ''; el.roundTabs.innerHTML = '';
    return;
  }
  renderRoundTabs();
  const playable = isPlayable();
  el.input.disabled = busy || !playable; el.submit.disabled = busy || !playable;
  el.input.placeholder = playable ? 'Digite uma palavra...' : '';
  el.attempts.textContent = `${activeState.attempts} ${activeState.attempts === 1 ? 'tentativa' : 'tentativas'}`;
  el.clues.textContent = (activeState.clues?.[viewing] || []).map((clue,index) => `${index + 1}. ${clue}`).join('\n');
  el.clues.classList.toggle('show', Boolean(activeState.clues?.[viewing]?.length));
  el.guesses.innerHTML = currentRound().map(guessRow).join('');
  updateHintButton();
}
async function refreshState() {
  activeState = await api(`/api/state?playerId=${encodeURIComponent(player)}&category=${encodeURIComponent(activeCategory.slug)}`);
  render();
}
el.form.addEventListener('submit', async event => {
  event.preventDefault();
  const display = el.input.value.trim().normalize('NFC').replace(/\s+/g,' ');
  if (!display || !isPlayable() || busy) return;
  if (!/^[\p{L}\p{M}]+(?:[ '\u2019-][\p{L}\p{M}]+)*$/u.test(display)) { notify('Use letras, espaços, hífen ou apóstrofo.'); return; }
  if (currentRound().some(item => key(item.word) === key(display))) { notify('Essa palavra já foi tentada.'); return; }
  busy = true; render();
  try {
    const result = await api('/api/guess', { playerId: player, category: activeCategory.slug, round: activeState.solved, word: display });
    await refreshState();
    if (result.correct) { viewing = Math.min(activeState.solved, 2); render(); }
    el.input.value = '';
    if (result.correct) notify(activeState.solved === 3 ? 'Categoria concluída!' : 'Acertou! A próxima palavra foi liberada.');
  } catch (error) { notify(error.message); }
  finally { busy = false; render(); if (isPlayable()) el.input.focus(); }
});
el.hint.addEventListener('click', async () => {
  if (el.hint.disabled || busy) return;
  busy = true; render();
  try {
    const result = await api('/api/hint', { playerId: player, category: activeCategory.slug });
    await refreshState();
    notify('Dica revelada.');
  } catch (error) { notify(error.message); }
  finally { busy = false; render(); }
});
async function start() {
  try {
    const config = await api('/api/config');
    categories = config.categories.map(category => ({...category, rounds: [0,1,2]}));
    if (!categories.length) throw new Error('Ainda não há categorias cadastradas.');
    await selectCategory(0);
  } catch (error) { notify(error.message); }
}
start();
</script>
</body>
</html>
