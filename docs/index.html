'saudade':{'saudades':96,'saudoso':78,'saudosa':78,'falta':84,'lembrar':72,'nostálgico':86,'nostálgica':86,'longe':63,'querido':57,'reminiscência':81},

'aracnídeo':{'aracnídeos':97,'aracnídea':94,'aranhas':91,'escorpiões':88,'oito patas':81,'invertebrado':66,'invertebrados':68,'teia de aranha':85,'venenoso':52,'venenosa':52},

puzzles.forEach(category=>category.rounds.forEach(round=>Object.assign(round.scores,extraScores[round.answer]||{})));const tipRequirements=[{total:30,since:0},{total:90,since:40},{total:180,since:60}],dailyTipLimit=7,categoryTipLimit=3,storageKey='palavra-secreta-tabs-v1';
const el={categories:document.querySelector('#categories'),roundTabs:document.querySelector('#roundTabs'),description:document.querySelector('#description'),form:document.querySelector('#form'),input:document.querySelector('#guess'),submit:document.querySelector('#form button[type="submit"]'),hint:document.querySelector('#hintButton'),hintBalance:document.querySelector('#hintBalance'),attempts:document.querySelector('#attempts'),clues:document.querySelector('#clues'),guesses:document.querySelector('#guesses'),toast:document.querySelector('#toast')};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const blankDay=()=>({date:today(),tips:dailyTipLimit,spent:0,correctsSinceSpend:0,categories:{}});
function loadDay(){try{const data=JSON.parse(localStorage.getItem(storageKey));return data?.date===today()?data:blankDay()}catch{return blankDay()}}
const day=loadDay();let activeCategory=puzzles[0];
function newProgress(category){return{solved:0,viewing:0,attempts:0,sinceTip:0,tipsUsed:0,rounds:category.rounds.map(()=>({guesses:[],clues:[]}))}}
function progress(category=activeCategory){if(!day.categories[category.name])day.categories[category.name]=newProgress(category);return day.categories[category.name]}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(day))}catch{}}
function norm(value){return value.trim().normalize('NFC').toLocaleLowerCase('pt-BR').replace(/[’‘]/g,"'").replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,' ')}
function key(value){return norm(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function renderCategories(){el.categories.innerHTML=puzzles.map((category,index)=>`<button class="tab" role="tab" aria-selected="${index===0}" data-index="${index}">${category.name}</button>`).join('');el.categories.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>selectCategory(Number(button.dataset.index))))}
function selectCategory(index){activeCategory=puzzles[index];const state=progress();state.viewing=Math.min(state.viewing,state.solved,2);el.categories.querySelectorAll('.tab').forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index))});el.description.textContent=activeCategory.description;render()}
function renderRoundTabs(){const state=progress();el.roundTabs.innerHTML=activeCategory.rounds.map((round,index)=>{const done=index<state.solved,selected=index===state.viewing,locked=index>state.solved,label=done?round.answer:String(index+1),accessible=done?`Palavra ${index+1}: ${round.answer}`:`Palavra ${index+1}${locked?' bloqueada':' atual'}`;return`<button class="round-tab ${done?'done':''}" role="tab" aria-selected="${selected}" aria-label="${escapeHtml(accessible)}" title="${done?escapeHtml(round.answer):''}" data-index="${index}" ${locked?'disabled':''}>${escapeHtml(label)}</button>`}).join('');el.roundTabs.querySelectorAll('.round-tab:not(:disabled)').forEach(button=>button.addEventListener('click',()=>{state.viewing=Number(button.dataset.index);save();render()}))}function render(){const state=progress(),view=state.viewing,round=state.rounds[view],isPlayable=view===state.solved&&state.solved<3;renderRoundTabs();el.input.disabled=!isPlayable;el.submit.disabled=!isPlayable;el.input.placeholder=isPlayable?'Digite uma palavra...':'';el.attempts.textContent=`${state.attempts} ${state.attempts===1?'tentativa':'tentativas'}`;el.clues.textContent=round.clues.map((clue,index)=>`${index+1}. ${clue}`).join('\n');el.clues.classList.toggle('show',round.clues.length>0);el.guesses.innerHTML=round.guesses.map(item=>guessRow(item)).join('');if(state.solved===3&&view===2)el.guesses.innerHTML=state.rounds.map((item,index)=>guessRow({word:activeCategory.rounds[index].answer,score:100,label:'Resolvida'})).join('');updateTipButton()}
function guessRow(item){return`<div class="guess"><span class="word">${escapeHtml(item.word)}</span><span class="proximity">${item.score?`<span class="bar"><span class="fill" style="width:${item.score}%"></span></span><span class="label">${item.label}</span>`:`<span class="label">—</span>`}</span></div>`}
function updateTipButton(){const state=progress(),index=state.tipsUsed,need=tipRequirements[index];el.hintBalance.textContent=day.tips;let reason='';if(state.viewing!==state.solved||state.solved>=3)reason='Abra a palavra atual para pedir dica.';else if(index>=categoryTipLimit)reason='Limite de dicas desta categoria atingido.';else if(day.tips<=0)reason='As dicas do dia acabaram.';else{const remaining=Math.max(need.total-state.attempts,need.since-state.sinceTip,0);if(remaining)reason=`Faltam ${remaining} tentativas para a próxima dica.`}el.hint.disabled=Boolean(reason);el.hint.title=reason||'Pedir uma dica';el.hint.setAttribute('aria-label',`${reason||'Pedir uma dica'} ${day.tips} disponíveis.`)}
el.hint.addEventListener('click',()=>{const state=progress(),round=state.rounds[state.viewing],puzzle=activeCategory.rounds[state.viewing];if(el.hint.disabled)return;round.clues.push(puzzle.clues[round.clues.length]);state.tipsUsed++;state.sinceTip=0;day.tips--;day.spent++;save();render()});
el.form.addEventListener('submit',event=>{event.preventDefault();const state=progress(),round=state.rounds[state.viewing],puzzle=activeCategory.rounds[state.viewing],display=el.input.value.trim().normalize('NFC').replace(/\s+/g,' ');if(!display||el.input.disabled)return;if(!/^[\p{L}\p{M}]+(?:[ '\u2019-][\p{L}\p{M}]+)*$/u.test(display)){notify('Use letras, espaços, hífen ou apóstrofo.');return}if(round.guesses.some(item=>key(item.word)===key(display))){notify('Essa palavra já foi tentada.');return}state.attempts++;state.sinceTip++;const guessed=key(display);if(guessed===key(puzzle.answer)){round.guesses.push({word:display,score:100,label:'Acertou'});state.solved++;state.viewing=state.solved<3?state.solved:2;let refunded=false;if(day.spent>0&&++day.correctsSinceSpend>=2){day.correctsSinceSpend-=2;if(day.tips<dailyTipLimit){day.tips++;refunded=true}}save();render();notify(state.solved===3?'Categoria concluída!'+(refunded?' Uma dica voltou ao seu saldo.':''): 'Acertou! A próxima palavra foi liberada.'+(refunded?' Uma dica voltou ao seu saldo.':''));el.input.value='';return}const found=Object.entries(puzzle.scores).find(([word])=>key(word)===guessed);round.guesses.push({word:display,score:found?.[1]||0,label:found?scoreLabel(found[1]):'—'});round.guesses.sort((a,b)=>b.score-a.score);save();render();el.input.value='';el.input.focus()});
function scoreLabel(score){return score>=85?'Quase lá':score>=60?'Perto':score>=35?'Aquecendo':'Distante'}
function escapeHtml(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
let toastTimer;function notify(message){el.toast.textContent=message;el.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.toast.classList.remove('show'),2400)}
renderCategories();selectCategory(0);
</script>
